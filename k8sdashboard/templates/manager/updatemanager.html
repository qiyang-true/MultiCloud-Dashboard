{% extends 'common/base.html' %}

{% block title %}菜单列表{% endblock %}

{% block content %}
<div class="layui-container">  
    <div class="layui-row">
      <div class="layui-col-md10">
          <fieldset class="layui-elem-field layui-field-title" style="margin-top:20px;">
              <legend>修改管理员</legend>
          </fieldset>
          <form class="layui-form" action="">
            <input name="id" type="hidden" value="{{ id }}">
            <div class="layui-form-item">
              <label class="layui-form-label">账号名称：</label>
              <div class="layui-input-inline">
                <input type="text" name="username" value="{{ username }}" required disabled lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input">
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">密码：</label>
              <div class="layui-input-inline">
                <input type="password" name="password" required placeholder="请输入密码" autocomplete="off" class="layui-input">
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">重复密码：</label>
              <div class="layui-input-inline">
                <input type="password" name="repassword" required placeholder="重复密码" autocomplete="off" class="layui-input">
              </div>
            </div>
            <div class="layui-form-item">
              <label class="layui-form-label">账号类型：</label>
              <div class="layui-input-inline">
                <select name="role_id" required>
                    <option value="">请选择</option>
                    {% for vo in role_list %}
                      <option value="{{ vo.id }}" {% if vo.id == info.role_id %}selected{% endif %}>{{ vo.name }}</option>
                    {% endfor %}
                  </select>
              </div>
            </div>
            <div class="layui-form-item">
              <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
              </div>
            </div>
          </form>
          </div>
      </div>
  </div>
  <script>
  //Demo
  layui.use('form', function(){
      var form = layui.form;
  
      //监听提交
      form.on('submit(formDemo)', function(data){
          var config = JSON.stringify(data.field);
          console.log(config);
          var json = {
              id: data.field.id,
              password: data.field.password,
              repassword: data.field.repassword,
              role_id: data.field.role_id
          };
          config.log(json)
          $.post('/manager/update/', json, function (data, status){
              console.log(data);
              if(status == 'success'){
                  layer.msg(data.info, {time: 2000});
                  //window.location.reload();
              }else{
                  layer.msg('请求错误');
              }
          });
          return false;
      });
  });
  </script>
{% endblock %}
