{% if regions %}
<style>
.region-bar{display:flex;justify-content:flex-end;margin:12px 0 0;}
.region-form select{height:32px;border:1px solid #d2d5da;border-radius:2px;padding:0 8px;color:#333;background:#fff;}
</style>
<div class="region-bar">
    <form class="region-form" method="get" action="">
        {% for key, value in request.GET.items %}
        {% if key != 'region' and key != 'topid' and key != 'leftpid' and key != 'leftid' %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endif %}
        {% endfor %}
        <input type="hidden" name="topid" value="{{ request.GET.topid|default:provider.top_menu_id }}">
        <input type="hidden" name="leftpid" value="{{ request.GET.leftpid|default:provider.parent_menu_id }}">
        <input type="hidden" name="leftid" value="{{ request.GET.leftid|default:provider.child_menu_id }}">
        <select name="region" onchange="this.form.submit()">
            <option value="">全部地域</option>
            {% for region in regions %}
            <option value="{{ region }}" {% if selected_region == region %}selected{% endif %}>{{ region }}</option>
            {% endfor %}
        </select>
    </form>
</div>
{% endif %}
