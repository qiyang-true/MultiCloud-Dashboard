<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<title>Dashboard</title>
	<meta charset="UTF-8">
	<link rel="shortcut icon" type="image/x-icon" href="" media="screen" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <link rel="stylesheet" href="/static/layui/css/layui.css" type="text/css"/>
    <script src="/static/js/jquery-1.8.0.min.js"></script>
    <script src="/static/layui/layui.js"></script>
<style>
body{
	max-width:600px;
	margin:0 auto;
	background: cadetblue;
}
.from-box{
	width:400px;
	margin:0 auto;
	margin-top:35%;
}
input[type=text],input[type=password]{
	width: 220px;
}
.check-code{
	height: 50px;
}
.layui-form{
    padding-top: 40px;
    border: 1px solid #ffffff;
    border-radius: 5px;
    background: #fdfdfd;
}
</style>
</head>
<body>
<div class="from-box">
	<form class="layui-form" action="">
	  <div class="layui-form-item">
		<label class="layui-form-label">输入框</label>
		<div class="layui-input-block">
		  <input type="text" name="username" required  lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input">
		</div>
	  </div>
	  <div class="layui-form-item">
		<label class="layui-form-label">密码框</label>
		<div class="layui-input-block">
		  <input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
		</div>
	  </div>
	  <!-- <div class="layui-form-item check-code">
		<label class="layui-form-label">验证码</label>
		<div class="layui-input-block">
			<input type="text" name="checkcode" style="width:100px;float:left;" required  lay-verify="required" placeholder="请输入验证码" autocomplete="off" class="layui-input">
			<img style="width:100px;height:40px;float:left;margin-left:20px;" onClick="this.src=this.src+'?'+Math.random()" src="__MODULE__/Login/checkCode" />
		</div>
	  </div> -->
	  <div class="layui-form-item">
		<label class="layui-form-label">保持登陆</label>
			<div class="layui-input-inline">
				<input type="checkbox" name="remember" lay-skin="switch" value="true">
				<button class="layui-btn" style="margin-left:40px;" lay-submit lay-filter="formDemo">立即提交</button>
			</div>
	  </div>
		<div class="layui-form-item">
		</div>
	</form>
</div>
<script>
//Demo
layui.use('form', function(){
	var form = layui.form;

	//监听提交
	form.on('submit(formDemo)', function(data){
		var config = JSON.stringify(data.field);
		console.log(config);
		var json = {
			username: data.field.username,
			password: data.field.password,
			// checkcode: data.field.checkcode,
			remember: data.field.remember
		};
		console.log(config);
		$.post('/login/check/', json, function (data, status){
			console.log(data);
			if(status == 'success'){
				layer.msg(data.info, {time: 2000});
				if(data.status == 1){
					window.location = '/';
				}else{
					layer.msg(data.info);
				}
			}else{
				layer.msg('请求错误');
			}
		});
		return false;
	});
});
</script>
</body>
</html>
