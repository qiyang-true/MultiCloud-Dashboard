{% extends 'common/base.html' %}

{% block title %}菜单列表{% endblock %}

{% block content %}
<style>
select,input[type="text"]{height: 38px;width:180px;text-indent:10px;line-height: 1.3;line-height: 38px\9;border-width: 1px;border-style: solid;background-color: #fff;border-radius: 2px;border-color: #e6e6e6;color:#666;}
input[type="text"]{height: 36px;}
.table tr{height:50px;}
</style>
<div class="layui-container">
    <div class="layui-row">
        <fieldset class="layui-elem-field layui-field-title">
            <legend>菜单列表</legend>
        </fieldset>
        {% load custom_filters %}
        <form action="/authority/updateauthority/{{ id }}/" method="post">
        <input type="hidden" name="id" value="{{ id }}"/>
        <table class="table">
            <tr>
                <td>上级分类：</td>
                <td>
                    <select name="pid">
                        <option value="0">全新分类</option>
                        {% for vo in menu_list %}
                        <option value="{{ vo.id }}" {% if current_menu.pid == vo.id %}selected{% endif %}>
                            {% for _ in vo.level|times %}　{% endfor %}{{ vo.menu }}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <td>Menu：</td>
                <td><input type="text" name="menu" value="{{ current_menu.menu }}"></td>
            </tr>
            <tr>
                <td>Controller：</td>
                <td><input type="text" name="controller" value="{{ current_menu.controller }}"></td>
            </tr>
            <tr>
                <td>Method：</td>
                <td><input type="text" name="method" value="{{ current_menu.method }}"></td>
            </tr>
            <tr>
                <td></td>
                <td><input class="btn layui-btn" type="submit" value="修改"> {{ msg }}</td>
            </tr>
        </table>
        </form>
    </div>
</div>
{% endblock %}
